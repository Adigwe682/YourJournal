<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password - MAZII TRADE</title>

  <link rel="stylesheet" href="../output.css">
</head>

<body class="min-h-screen bg-[#080808] text-white">

  <div class="min-h-screen flex items-center justify-center px-6 py-12">

    <div class="w-full max-w-md">

      <!-- Brand -->
      <div class="text-center mb-8">

        <div class="inline-flex items-center gap-2 mb-4">

          <div class="w-9 h-9 rounded-lg bg-orange-500 flex items-center justify-center">
            <span class="font-black text-black">M</span>
          </div>

          <span class="text-xl font-bold tracking-wide">
            MAZIIi<span class="text-orange-500">TRADE</span>
          </span>

        </div>

        <p class="text-sm text-gray-500">
          Trading P&L Journal
        </p>

      </div>


      <!-- Forgot Password Card -->
      <div class="bg-[#111111] border border-white/10 rounded-2xl p-8 shadow-2xl">

        <div class="mb-8">

          <h1 class="text-3xl font-bold mb-2">
            Forgot password?
          </h1>

          <p class="text-gray-400 text-sm leading-6">
            Enter the email address associated with your account and we'll send you instructions to reset your password.
          </p>

        </div>


        <!-- Form -->
        <form id="forgotPasswordForm">

          <div class="mb-6">

            <label
              for="email"
              class="block text-sm font-medium text-gray-300 mb-2"
            >
              Email address
            </label>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              class="w-full px-4 py-3.5 bg-[#0a0a0a] border border-white/10 rounded-xl text-white placeholder-gray-600 outline-none transition focus:border-orange-500 focus:ring-1 focus:ring-orange-500"
              required
            >

          </div>


          <button
            type="submit"
            class="w-full py-3.5 bg-orange-500 hover:bg-orange-400 text-black font-bold rounded-xl transition duration-200"
          >
            Send reset link
          </button>

        </form>


        <!-- Back to Login -->
        <div class="mt-7 pt-6 border-t border-white/10 text-center">

          <a
            href="./login.html"
            class="text-sm text-orange-500 hover:text-orange-400 font-medium"
          >
            ← Back to login
          </a>

        </div>

      </div>


      <!-- Footer -->
      <p class="text-center text-xs text-gray-600 mt-6">
        Track your trades. Understand your performance. Improve your process.
      </p>

    </div>

  </div>

</body>

</html>
