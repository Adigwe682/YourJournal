<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Trade - YourJournal</title>
  <link rel="stylesheet" href="../output.css">
</head>

<body class="bg-[#080808] text-white">
  <header class="border-b border-white/10 bg-[#0b0b0b]">
    <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="font-bold tracking-wide">
          Your<span class="text-orange-500">Journal</span>
        </h1>
        <p class="text-xs text-gray-500">
          Record Trade
        </p>
      </div>
      <a href="./dashboard.html" class="text-sm text-gray-400 hover:text-white transition">
        ← Back to Dashboard
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10">
    <div class="mb-8">
      <h2 class="text-2xl font-bold">
        Add New Trade
      </h2>
      <p class="text-sm text-gray-500 mt-1">
        Record your trade and keep your performance history organized.
      </p>
    </div>

    <form id="addTradeForm" class="bg-[#111111] border border-white/10 rounded-2xl p-6" enctype="multipart/form-data">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- Pair -->
        <div>
          <label for="pair" class="block text-sm text-gray-400 mb-2">
            Trading Pair
          </label>
          <input id="pair" name="pair" type="text" placeholder="e.g. XAUUSD" required
            class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-600 outline-none focus:border-orange-500 transition">
        </div>

        <!-- Date -->
        <div>
          <label for="date" class="block text-sm text-gray-400 mb-2">
            Trade Date
          </label>
          <input id="date" name="date" type="date" required
            class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-orange-500 transition">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-5">
        <!-- RR -->
        <div>
          <label for="rr" class="block text-sm text-gray-400 mb-2">
            Risk / Reward
          </label>
          <input id="rr" name="rr" type="number" step="0.1" placeholder="e.g. 5" required
            class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-600 outline-none focus:border-orange-500 transition">
        </div>

        <!-- P&L -->
        <div>
          <label for="pnl" class="block text-sm text-gray-400 mb-2">
            P&L
          </label>
          <input id="pnl" name="pnl" type="number" step="0.01" placeholder="e.g. 100" required
            class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-600 outline-none focus:border-orange-500 transition">
        </div>
      </div>

      <!-- Direction: Buy / Sell -->
      <div class="mt-5">
        <span class="block text-sm text-gray-400 mb-2">
          Direction
        </span>
        <div class="grid grid-cols-2 gap-3" role="radiogroup" aria-label="Trade direction">
          <label class="relative cursor-pointer">
            <input type="radio" id="directionBuy" name="direction" value="buy" class="peer sr-only" checked>
            <span class="block w-full rounded-xl border border-white/10 bg-[#0b0b0b] px-4 py-3 text-center text-sm font-semibold text-gray-400 transition
              peer-checked:border-green-500/50 peer-checked:bg-green-500/10 peer-checked:text-green-400
              peer-focus-visible:ring-2 peer-focus-visible:ring-green-500/60 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-[#080808]">
              Buy
            </span>
          </label>

          <label class="relative cursor-pointer">
            <input type="radio" id="directionSell" name="direction" value="sell" class="peer sr-only">
            <span class="block w-full rounded-xl border border-white/10 bg-[#0b0b0b] px-4 py-3 text-center text-sm font-semibold text-gray-400 transition
              peer-checked:border-red-500/50 peer-checked:bg-red-500/10 peer-checked:text-red-400
              peer-focus-visible:ring-2 peer-focus-visible:ring-red-500/60 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-[#080808]">
              Sell
            </span>
          </label>
        </div>
      </div>

      <div class="mt-5">
        <label for="result" class="block text-sm text-gray-400 mb-2">
          Trade Result
        </label>
        <select id="result" name="result" required
          class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-orange-500 transition">
          <option value="" disabled selected>
            Select result
          </option>
          <option value="profit">Profit</option>
          <option value="loss">Loss</option>
          <option value="breakeven">Breakeven</option>
        </select>
      </div>

      <!-- Challenge link: add-trade.js only reveals this when
           the trader has an active challenge, and defaults to it. -->
      <div id="challengeField" class="mt-5 hidden">
        <label for="challengeId" class="block text-sm text-gray-400 mb-2">
          Challenge
        </label>
        <select id="challengeId" name="challengeId"
          class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-orange-500 transition">
          <option value="">Not part of a challenge</option>
        </select>
        <p id="challengeHint" class="mt-2 text-xs text-orange-400"></p>
      </div>

      <!-- Session, Setup & Psychology Quick-Tags -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-5">
        <div>
          <label for="session" class="block text-sm text-gray-400 mb-2">
            Trading Session
          </label>
          <select id="session" name="session"
            class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-orange-500 transition">
            <option value="">Select Session</option>
            <option value="London">London</option>
            <option value="New York">New York</option>
            <option value="Asia">Asia</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label for="setupTag" class="block text-sm text-gray-400 mb-2">
            Setup Tag
          </label>
          <input id="setupTag" name="setupTag" type="text" maxlength="40"
            placeholder="e.g. BOS, CHoCH, Discount, Confirmation Entry"
            class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 outline-none focus:border-orange-500 transition">
        </div>

        <div>
          <label for="psychology" class="block text-sm text-gray-400 mb-2">
            Discipline / Psychology
          </label>
          <select id="psychology" name="psychology"
            class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-orange-500 transition">
            <option value="Followed Plan">Followed Plan</option>
            <option value="FOMO">FOMO</option>
            <option value="Revenge Trade">Revenge Trade</option>
            <option value="Early Exit">Early Exit</option>
            <option value="Over-leveraged">Over-leveraged</option>
          </select>
        </div>
      </div>

      <!-- Criteria / Setup Notes -->
      <div class="mt-5">
        <label for="criteria" class="block text-sm text-gray-400 mb-2">
          Trade Criteria / Setup Notes (e.g. 1H BOS, 15m CHoCH, Discount Zone)
        </label>
        <textarea id="criteria" name="criteria" rows="3"
          placeholder="Describe the confluence and criteria that made you take this trade..."
          class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-600 outline-none focus:border-orange-500 transition resize-none"></textarea>
      </div>

      <!-- Picture Snippet / Chart Screenshot -->
      <div class="mt-5">
        <label for="image" class="block text-sm text-gray-400 mb-2">
          Trade Picture Snippet (Chart Screenshot)
        </label>
        <input id="image" name="image" type="file" accept="image/*"
          class="w-full bg-[#0b0b0b] border border-white/10 rounded-xl px-4 py-3 text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-orange-500 file:text-black hover:file:bg-orange-400 outline-none transition cursor-pointer">

        <p class="mt-2 text-xs text-gray-400">
          Or skip the file picker — take a screenshot (PrtScn), then press
          <span class="font-mono text-white">Ctrl+V</span> anywhere on this page.
        </p>

        <!-- Preview of the chosen / pasted screenshot -->
        <div id="imagePreview"
          class="mt-3 hidden items-center gap-3 rounded-xl border border-white/10 bg-[#0b0b0b] p-3">
          <img id="imagePreviewImg" alt="Screenshot preview"
            class="h-16 w-16 shrink-0 rounded-lg object-cover border border-white/10">
          <div class="min-w-0 flex-1">
            <p id="imagePreviewName" class="truncate text-sm text-white"></p>
            <p id="imagePreviewSize" class="mt-0.5 text-xs text-gray-400"></p>
          </div>
          <button type="button" id="imagePreviewRemove"
            class="shrink-0 rounded-lg border border-white/10 px-3 py-1.5 text-xs text-gray-400 hover:text-white hover:border-white/25 transition">
            Remove
          </button>
        </div>
      </div>

      <div class="mt-8 flex items-center justify-end gap-3">
        <a href="./dashboard.html"
          class="px-5 py-3 rounded-xl border border-white/10 text-gray-400 hover:text-white hover:border-white/20 transition">
          Cancel
        </a>
        <button type="submit"
          class="px-6 py-3 rounded-xl bg-orange-500 hover:bg-orange-400 text-black font-bold transition">
          Save Trade
        </button>
      </div>
    </form>
  </main>

  <script src="../js/api-config.js"></script>
  <script src="../js/add-trade.js"></script>
</body>

</html>
